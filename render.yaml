# Render blueprint: one web service, no database.
# In the Render dashboard choose New > Blueprint, pick this repo, then paste the API key when asked.
services:
  - type: web
    name: ed-cost-estimator
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/meta
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: OPENAI_MODEL
        value: gpt-6-luna
      - key: OPENAI_API_KEY
        sync: false   # entered by hand in the dashboard; never stored in the repo
