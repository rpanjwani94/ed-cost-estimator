# Visits the hosted app every 10 minutes (at minutes 3, 13, 23, ...; off the busy round minutes) so Render's free plan does not put it to sleep.
# Delete this file (or disable the workflow under the repo's Actions tab) when the hosted copy is no longer needed.
name: Keep hosted app awake

on:
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Visit the app
        run: curl --silent --show-error --fail --max-time 120 --retry 2 --output /dev/null https://ed-cost-estimator.onrender.com/api/meta
